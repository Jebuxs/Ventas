<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JADI · Tienda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #f8f5f0; font-family: 'Inter', sans-serif; }
        .card-producto { background: #fff; border-radius: 1rem; border: 1px solid #e5e0d8; padding: 1rem; transition: transform 0.2s; }
        .card-producto:hover { transform: scale(1.02); }
        .btn-primary { background: #e85d04; color: #fff; font-weight: 600; padding: 0.5rem 1.2rem; border-radius: 0.5rem; border: none; cursor: pointer; }
        .btn-primary:hover { background: #d35400; }
        .btn-secondary { background: #6b7280; color: #fff; font-weight: 600; padding: 0.5rem 1.2rem; border-radius: 0.5rem; border: none; cursor: pointer; }
        .btn-secondary:hover { background: #4b5563; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 999; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: #fff; border-radius: 1.2rem; padding: 2rem; max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto; }
        .modal-box input, .modal-box select { width: 100%; padding: 0.6rem 0.8rem; background: #f8f5f0; border: 1px solid #ddd; border-radius: 0.5rem; margin-bottom: 0.8rem; }
        .modal-box label { display: block; font-size: 0.75rem; color: #6b6b6b; font-weight: 600; margin-bottom: 0.2rem; }
        .filtro-btn { background: #fff; border: 1px solid #e5e0d8; padding: 0.4rem 1.2rem; border-radius: 9999px; cursor: pointer; transition: 0.2s; }
        .filtro-btn:hover { background: #e85d04; color: #fff; border-color: #e85d04; }
        .filtro-btn.active { background: #e85d04; color: #fff; border-color: #e85d04; }
        .badge-estado { display: inline-block; padding: 0.2rem 0.7rem; border-radius: 9999px; font-size: 0.65rem; font-weight: 600; text-transform: uppercase; }
        .badge-pendiente_pago { background: #fef3c7; color: #92400e; }
        .badge-pagado { background: #d1fae5; color: #065f46; }
        .badge-enviado { background: #dbeafe; color: #1e3a8a; }
        .badge-entregado { background: #d1fae5; color: #065f46; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="bg-white shadow-md p-4 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-orange-600">JADI</h1>
            <div class="flex items-center gap-4">
                <span class="text-sm text-gray-600" id="usuarioEmail">Invitado</span>
                <a href="login.html" class="btn-primary text-sm">Ingresar</a>
                <button onclick="verCarrito()" class="btn-secondary text-sm">🛒 Carrito (<span id="carritoCount">0</span>)</button>
            </div>
        </div>
    </nav>

    <!-- Filtros -->
    <div class="container mx-auto p-4 flex gap-2 flex-wrap">
        <button class="filtro-btn active" data-categoria="todos">Todos</button>
        <button class="filtro-btn" data-categoria="zapatos">👟 Zapatos</button>
        <button class="filtro-btn" data-categoria="ropa">👕 Ropa</button>
        <button class="filtro-btn" data-categoria="bolsos">👜 Bolsos</button>
        <button class="filtro-btn" data-categoria="accesorios">⌚ Accesorios</button>
    </div>

    <!-- Catálogo -->
    <main class="container mx-auto p-4">
        <div id="catalogo" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <p class="col-span-full text-center text-gray-500">Cargando productos...</p>
        </div>
    </main>

    <!-- MODAL CARRITO -->
    <div class="modal-overlay" id="modalCarrito">
        <div class="modal-box">
            <h2 class="text-2xl font-bold text-orange-600">🛒 Tu Carrito</h2>
            <div id="contenidoCarrito" class="my-4">
                <p class="text-gray-500">El carrito está vacío.</p>
            </div>
            <div id="resumenCarrito" class="hidden">
                <div class="flex justify-between font-bold text-lg">
                    <span>Total:</span>
                    <span id="totalCarrito">$0.00</span>
                </div>
                <button onclick="procesarPedido()" class="btn-primary w-full mt-4">Confirmar Pedido</button>
            </div>
            <button onclick="cerrarModalCarrito()" class="btn-secondary w-full mt-2">Cerrar</button>
        </div>
    </div>

    <!-- MODAL SELECCIÓN TALLA/COLOR -->
    <div class="modal-overlay" id="modalSeleccion">
        <div class="modal-box">
            <h2 class="text-2xl font-bold text-orange-600">Selecciona talla y color</h2>
            <div id="infoProductoSeleccion" class="mb-4">
                <p><strong>Producto:</strong> <span id="seleccionNombre"></span></p>
                <p><strong>Precio:</strong> $<span id="seleccionPrecio"></span></p>
            </div>
            <label>Talla</label>
            <select id="seleccionTalla">
                <option value="">Selecciona una talla</option>
            </select>
            <label>Color</label>
            <select id="seleccionColor">
                <option value="">Selecciona un color</option>
            </select>
            <div class="flex gap-3 mt-4">
                <button onclick="agregarAlCarritoConfirmado()" class="btn-primary flex-1">Agregar al carrito</button>
                <button onclick="cerrarModalSeleccion()" class="btn-secondary flex-1">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- MODAL PAGO (Transferencia) -->
    <div class="modal-overlay" id="modalPago">
        <div class="modal-box">
            <h2 class="text-2xl font-bold text-orange-600">💳 Realizar Pago</h2>
            <p class="text-sm text-gray-600 mb-4">Selecciona tu banco y realiza la transferencia. Luego ingresa el número de transacción.</p>
            <label>Banco</label>
            <select id="bancoSeleccionado" class="w-full p-2 border rounded">
                <option value="">Selecciona un banco</option>
                <option value="pichincha">Banco Pichincha</option>
                <option value="solidario">Banco Solidario</option>
                <option value="guayaquil">Banco Guayaquil</option>
                <option value="pacifico">Banco Pacífico</option>
                <option value="produbanco">Produbanco</option>
                <option value="internacional">Banco Internacional</option>
                <option value="bolivariano">Banco Bolivariano</option>
                <option value="austro">Banco del Austro</option>
                <option value="loja">Banco de Loja</option>
                <option value="amazonas">Banco Amazonas</option>
            </select>
            <label>Número de Transacción</label>
            <input type="text" id="numeroTransaccion" placeholder="Ej: 123456789" />
            <div class="flex gap-3 mt-4">
                <button onclick="confirmarPago()" class="btn-primary flex-1">Confirmar Pago</button>
                <button onclick="cerrarModalPago()" class="btn-secondary flex-1">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";

        // Configuración Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyB2p4mFewLlKojEAAfMfNi76U9K3HiIiAo",
            authDomain: "ventas-dcc22.firebaseapp.com",
            projectId: "ventas-dcc22",
            storageBucket: "ventas-dcc22.firebasestorage.app",
            messagingSenderId: "789904237680",
            appId: "1:789904237680:web:45b32dd8e211193e1e40b5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let productos = [];
        let carrito = [];
        let usuarioActual = null;
        let categoriaActual = 'todos';

        // ============================================================
        // AUTENTICACIÓN
        // ============================================================
        onAuthStateChanged(auth, (user) => {
            if (user) {
                usuarioActual = user;
                document.getElementById('usuarioEmail').textContent = user.email;
            } else {
                usuarioActual = null;
                document.getElementById('usuarioEmail').textContent = 'Invitado';
            }
        });

        // ============================================================
        // FILTROS POR CATEGORÍA
        // ============================================================
        document.querySelectorAll('.filtro-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                categoriaActual = btn.dataset.categoria;
                renderizarProductos();
            });
        });

        // ============================================================
        // CARGAR PRODUCTOS DESDE FIRESTORE
        // ============================================================
        function cargarProductos() {
            onSnapshot(collection(db, "calzado"), (snapshot) => {
                productos = [];
                snapshot.forEach(doc => {
                    productos.push({ id: doc.id, ...doc.data() });
                });
                renderizarProductos();
            });
        }

        function renderizarProductos() {
            const catalogo = document.getElementById('catalogo');
            catalogo.innerHTML = '';

            let productosFiltrados = productos;
            if (categoriaActual !== 'todos') {
                productosFiltrados = productos.filter(p => p.categoria === categoriaActual);
            }

            if (productosFiltrados.length === 0) {
                catalogo.innerHTML = '<p class="col-span-full text-center text-gray-500">No hay productos en esta categoría.</p>';
                return;
            }

            productosFiltrados.forEach(prod => {
                const card = document.createElement('div');
                card.className = 'card-producto';
                card.innerHTML = `
                    <img src="${prod.imagen || 'https://via.placeholder.com/150'}" class="w-full h-48 object-cover rounded-lg mb-3" />
                    <h3 class="font-bold text-lg">${prod.nombre}</h3>
                    <p class="text-sm text-gray-500">${prod.descripcion || ''}</p>
                    <p class="text-xl font-bold text-orange-600 mt-2">$${prod.precio.toFixed(2)}</p>
                    <button onclick="abrirModalSeleccion('${prod.id}')" class="btn-primary w-full mt-3">Agregar al carrito</button>
                `;
                catalogo.appendChild(card);
            });
        }

        // ============================================================
        // SELECCIÓN DE TALLA Y COLOR (MODAL)
        // ============================================================
        let productoSeleccionadoId = null;

        window.abrirModalSeleccion = (productoId) => {
            const prod = productos.find(p => p.id === productoId);
            if (!prod) return;

            productoSeleccionadoId = productoId;
            document.getElementById('seleccionNombre').textContent = prod.nombre;
            document.getElementById('seleccionPrecio').textContent = prod.precio.toFixed(2);

            // Llenar tallas
            const tallaSelect = document.getElementById('seleccionTalla');
            tallaSelect.innerHTML = '<option value="">Selecciona una talla</option>';
            if (prod.tallas && prod.tallas.length) {
                prod.tallas.forEach(t => {
                    tallaSelect.innerHTML += `<option value="${t}">${t}</option>`;
                });
            } else {
                tallaSelect.innerHTML += `<option value="Única">Única</option>`;
            }

            // Llenar colores
            const colorSelect = document.getElementById('seleccionColor');
            colorSelect.innerHTML = '<option value="">Selecciona un color</option>';
            if (prod.colores && prod.colores.length) {
                prod.colores.forEach(c => {
                    colorSelect.innerHTML += `<option value="${c}">${c}</option>`;
                });
            } else {
                colorSelect.innerHTML += `<option value="Estándar">Estándar</option>`;
            }

            document.getElementById('modalSeleccion').classList.add('active');
        };

        window.cerrarModalSeleccion = () => {
            document.getElementById('modalSeleccion').classList.remove('active');
        };

        window.agregarAlCarritoConfirmado = () => {
            const talla = document.getElementById('seleccionTalla').value;
            const color = document.getElementById('seleccionColor').value;

            if (!talla || !color) {
                alert('Selecciona una talla y un color.');
                return;
            }

            const prod = productos.find(p => p.id === productoSeleccionadoId);
            if (!prod) return;

            carrito.push({
                id: prod.id,
                nombre: prod.nombre,
                precio: prod.precio,
                talla: talla,
                color: color,
                cantidad: 1
            });

            cerrarModalSeleccion();
            actualizarCarritoUI();
        };

        // ============================================================
        // CARRITO
        // ============================================================
        function actualizarCarritoUI() {
            document.getElementById('carritoCount').textContent = carrito.length;
        }

        window.verCarrito = () => {
            const modal = document.getElementById('modalCarrito');
            const contenido = document.getElementById('contenidoCarrito');
            const resumen = document.getElementById('resumenCarrito');

            if (carrito.length === 0) {
                contenido.innerHTML = '<p class="text-gray-500">El carrito está vacío.</p>';
                resumen.classList.add('hidden');
            } else {
                let html = '';
                let total = 0;
                carrito.forEach((item, index) => {
                    total += item.precio * item.cantidad;
                    html += `
                        <div class="flex justify-between items-center border-b py-2">
                            <div>
                                <p class="font-bold">${item.nombre}</p>
                                <p class="text-xs text-gray-500">Talla: ${item.talla} | Color: ${item.color}</p>
                            </div>
                            <div>
                                <span class="font-bold">$${item.precio.toFixed(2)}</span>
                                <button onclick="eliminarDelCarrito(${index})" class="text-red-500 ml-2">🗑️</button>
                            </div>
                        </div>
                    `;
                });
                contenido.innerHTML = html;
                document.getElementById('totalCarrito').textContent = `$${total.toFixed(2)}`;
                resumen.classList.remove('hidden');
            }

            modal.classList.add('active');
        };

        window.cerrarModalCarrito = () => {
            document.getElementById('modalCarrito').classList.remove('active');
        };

        window.eliminarDelCarrito = (index) => {
            carrito.splice(index, 1);
            actualizarCarritoUI();
            // Si el carrito está abierto, refrescar la vista
            if (document.getElementById('modalCarrito').classList.contains('active')) {
                verCarrito();
            }
        };

        // ============================================================
        // PROCESAR PEDIDO (con pago)
        // ============================================================
        window.procesarPedido = () => {
            if (!usuarioActual) {
                alert('Debes iniciar sesión para realizar un pedido.');
                return;
            }

            if (carrito.length === 0) {
                alert('El carrito está vacío.');
                return;
            }

            cerrarModalCarrito();
            document.getElementById('modalPago').classList.add('active');
        };

        window.cerrarModalPago = () => {
            document.getElementById('modalPago').classList.remove('active');
        };

        window.confirmarPago = async () => {
            const banco = document.getElementById('bancoSeleccionado').value;
            const numeroTransaccion = document.getElementById('numeroTransaccion').value.trim();

            if (!banco) {
                alert('Selecciona un banco.');
                return;
            }

            if (!numeroTransaccion) {
                alert('Ingresa el número de transacción.');
                return;
            }

            const total = carrito.reduce((acc, item) => acc + item.precio * item.cantidad, 0);

            const pedido = {
                clienteEmail: usuarioActual.email,
                articulos: carrito.map(item => ({
                    nombre: item.nombre,
                    talla: item.talla,
                    color: item.color,
                    cantidad: item.cantidad,
                    precio: item.precio
                })),
                total: total,
                fecha: new Date().toLocaleString(),
                estado: 'pendiente_pago',
                banco: banco,
                numeroTransaccion: numeroTransaccion
            };

            try {
                await addDoc(collection(db, "pedidos"), pedido);
                alert('✅ Pedido confirmado. Espera la validación del pago.');
                carrito = [];
                actualizarCarritoUI();
                cerrarModalPago();
            } catch (error) {
                alert('Error al procesar el pedido: ' + error.message);
            }
        };

        // ============================================================
        // INICIALIZAR
        // ============================================================
        cargarProductos();
        console.log('🔥 Tienda JADI cargada correctamente.');
    </script>
</body>
</html>
