<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JADI · Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #f8f5f0;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #fff;
            padding: 2rem;
            border-radius: 1.2rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            max-width: 400px;
            width: 90%;
        }
        .login-card h1 {
            color: #e85d04;
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 0.5rem;
        }
        .login-card p {
            text-align: center;
            color: #6b6b6b;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        .login-card input {
            width: 100%;
            padding: 0.6rem 0.8rem;
            background: #f8f5f0;
            border: 1px solid #ddd;
            border-radius: 0.5rem;
            margin-bottom: 0.8rem;
            font-size: 0.9rem;
        }
        .login-card input:focus {
            outline: none;
            border-color: #e85d04;
        }
        .login-card .btn-primary {
            background: #e85d04;
            color: #fff;
            font-weight: 600;
            padding: 0.6rem;
            border: none;
            border-radius: 0.5rem;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
        }
        .login-card .btn-primary:hover {
            background: #d35400;
        }
        .login-card .register-link {
            display: block;
            text-align: center;
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #6b6b6b;
        }
        .login-card .register-link a {
            color: #e85d04;
            font-weight: 600;
            text-decoration: underline;
        }
        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 0.5rem;
            border-radius: 0.5rem;
            font-size: 0.8rem;
            margin-bottom: 0.8rem;
            display: none;
        }
        .loading-message {
            text-align: center;
            font-size: 0.85rem;
            color: #92400e;
            background: #fef3c7;
            padding: 0.3rem;
            border-radius: 0.5rem;
            margin-top: 0.5rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>JADI</h1>
        <p>Inicia sesión para continuar</p>

        <div id="error-message" class="error-message"></div>
        <div id="loading-message" class="loading-message">⏳ Verificando...</div>

        <form id="login-form">
            <input type="email" id="email" placeholder="Correo electrónico" required />
            <input type="password" id="password" placeholder="Contraseña" required />
            <button type="submit" class="btn-primary" id="btn-login">Ingresar</button>
        </form>

        <div class="register-link">
            ¿No tienes cuenta? <a href="#" id="link-registro">Regístrate aquí</a>
        </div>

        <!-- Formulario de registro (oculto por defecto) -->
        <div id="registro-form" style="display: none; margin-top: 1.5rem; border-top: 1px solid #e5e0d8; padding-top: 1.5rem;">
            <h3 class="text-lg font-bold text-gray-800 mb-2">Registro</h3>
            <input type="text" id="reg-nombre" placeholder="Nombre completo" />
            <input type="email" id="reg-email" placeholder="Correo electrónico" required />
            <input type="password" id="reg-password" placeholder="Contraseña" required />
            <input type="tel" id="reg-whatsapp" placeholder="WhatsApp (ej: +593999999999)" />
            <button type="button" id="btn-registrar" class="btn-primary">Registrarme</button>
            <button type="button" id="btn-volver-login" class="btn-secondary" style="margin-top: 0.5rem; background: #6b7280; color: #fff; font-weight: 600; padding: 0.6rem; border: none; border-radius: 0.5rem; width: 100%; cursor: pointer;">Volver al inicio de sesión</button>
        </div>
    </div>

    <script type="module">
        import { 
            auth, 
            db,
            iniciarSesion, 
            registrarUsuario, 
            obtenerRolUsuario,
            esAdmin
        } from "./core/auth.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";

        // ============================================================
        // ELEMENTOS DEL DOM
        // ============================================================
        const loginForm = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const btnLogin = document.getElementById('btn-login');
        const errorDiv = document.getElementById('error-message');
        const loadingDiv = document.getElementById('loading-message');
        const linkRegistro = document.getElementById('link-registro');
        const registroForm = document.getElementById('registro-form');
        const btnRegistrar = document.getElementById('btn-registrar');
        const btnVolverLogin = document.getElementById('btn-volver-login');
        const regNombre = document.getElementById('reg-nombre');
        const regEmail = document.getElementById('reg-email');
        const regPassword = document.getElementById('reg-password');
        const regWhatsapp = document.getElementById('reg-whatsapp');

        // ============================================================
        // REDIRECCIÓN SEGÚN ROL
        // ============================================================
        async function redirigirSegunRol(user) {
            if (!user) return;
            const rol = await obtenerRolUsuario(user.uid);
            console.log("Rol del usuario:", rol);
            
            if (rol === "admin") {
                window.location.href = "admin/admin.html";
            } else if (rol === "cliente" || rol === null) {
                window.location.href = "index.html";
            } else {
                // Si no tiene rol, redirigir al index (por defecto)
                window.location.href = "index.html";
            }
        }

        // ============================================================
        // VERIFICAR SESIÓN AL CARGAR LA PÁGINA
        // ============================================================
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // Si ya está autenticado, redirigir según su rol
                await redirigirSegunRol(user);
            }
        });

        // ============================================================
        // INICIAR SESIÓN
        // ============================================================
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                mostrarError('Por favor, completa todos los campos.');
                return;
            }

            // Mostrar loading
            loadingDiv.style.display = 'block';
            btnLogin.disabled = true;
            errorDiv.style.display = 'none';

            try {
                // Autenticar al usuario
                const user = await iniciarSesion(email, password);
                
                // Verificar rol y redirigir
                await redirigirSegunRol(user);
                
            } catch (error) {
                console.error('Error al iniciar sesión:', error);
                let mensaje = 'Error al iniciar sesión.';
                if (error.code === 'auth/user-not-found') {
                    mensaje = 'No existe una cuenta con este correo.';
                } else if (error.code === 'auth/wrong-password') {
                    mensaje = 'Contraseña incorrecta.';
                } else if (error.code === 'auth/invalid-email') {
                    mensaje = 'Correo electrónico inválido.';
                } else {
                    mensaje = error.message || 'Error desconocido.';
                }
                mostrarError(mensaje);
            } finally {
                loadingDiv.style.display = 'none';
                btnLogin.disabled = false;
            }
        });

        // ============================================================
        // REGISTRO DE NUEVO USUARIO
        // ============================================================
        btnRegistrar.addEventListener('click', async () => {
            const nombre = regNombre.value.trim();
            const email = regEmail.value.trim();
            const password = regPassword.value;
            const whatsapp = regWhatsapp.value.trim();

            if (!email || !password || !nombre) {
                alert('Por favor, completa todos los campos obligatorios.');
                return;
            }

            try {
                const user = await registrarUsuario(email, password, {
                    nombre: nombre,
                    whatsapp: whatsapp
                });
                alert('✅ Registro exitoso. Ahora inicia sesión.');
                // Limpiar y ocultar registro
                registroForm.style.display = 'none';
                loginForm.style.display = 'block';
                linkRegistro.style.display = 'block';
                // Redirigir al login (ya está autenticado, pero lo redirigimos al index)
                window.location.href = 'index.html';
            } catch (error) {
                console.error('Error al registrar:', error);
                let mensaje = 'Error al registrar.';
                if (error.code === 'auth/email-already-in-use') {
                    mensaje = 'Este correo ya está registrado.';
                } else if (error.code === 'auth/weak-password') {
                    mensaje = 'La contraseña debe tener al menos 6 caracteres.';
                } else {
                    mensaje = error.message || 'Error desconocido.';
                }
                alert('❌ ' + mensaje);
            }
        });

        // ============================================================
        // MOSTRAR/OCULTAR FORMULARIOS
        // ============================================================
        linkRegistro.addEventListener('click', (e) => {
            e.preventDefault();
            loginForm.style.display = 'none';
            registroForm.style.display = 'block';
            linkRegistro.style.display = 'none';
        });

        btnVolverLogin.addEventListener('click', () => {
            loginForm.style.display = 'block';
            registroForm.style.display = 'none';
            linkRegistro.style.display = 'block';
        });

        // ============================================================
        // FUNCIÓN PARA MOSTRAR ERRORES
        // ============================================================
        function mostrarError(mensaje) {
            errorDiv.textContent = '❌ ' + mensaje;
            errorDiv.style.display = 'block';
        }
    </script>
</body>
</html>
