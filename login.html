<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JADI · Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #f8f5f0; font-family: 'Inter', sans-serif; }
        .btn-primary { background: #e85d04; color: #fff; font-weight: 600; padding: 0.5rem 1.2rem; border-radius: 0.5rem; border: none; cursor: pointer; }
        .btn-primary:hover { background: #d35400; }
        .btn-google { background: #fff; border: 1px solid #ddd; padding: 0.5rem 1.2rem; border-radius: 0.5rem; cursor: pointer; }
        .btn-google:hover { background: #f0f0f0; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full">
        <h1 class="text-3xl font-bold text-orange-600 text-center mb-2">JADI</h1>
        <p class="text-center text-gray-500 mb-6">Inicia sesión para comprar</p>

        <button id="btnGoogle" class="btn-google w-full flex items-center justify-center gap-2 mb-4">
            <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Continuar con Google
        </button>

        <div class="flex items-center my-4"><hr class="flex-1 border-gray-200" /><span class="px-3 text-xs text-gray-400">o</span><hr class="flex-1 border-gray-200" /></div>

        <form id="formLogin">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" required class="mt-1 block w-full p-2 border rounded bg-gray-50" />
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700">Contraseña</label>
                <input type="password" id="password" required class="mt-1 block w-full p-2 border rounded bg-gray-50" />
            </div>
            <button type="submit" class="btn-primary w-full">Iniciar Sesión</button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-4">
            ¿No tienes cuenta? <a href="#" onclick="alternarRegistro()" class="text-orange-600 underline">Regístrate</a>
        </p>
        <div id="registroExtra" class="hidden mt-4">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700">WhatsApp</label>
                <input type="tel" id="whatsapp" placeholder="+593999999999" class="mt-1 block w-full p-2 border rounded bg-gray-50" />
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB2p4mFewLlKojEAAfMfNi76U9K3HiIiAo",
            authDomain: "ventas-dcc22.firebaseapp.com",
            projectId: "ventas-dcc22",
            storageBucket: "ventas-dcc22.firebasestorage.app",
            messagingSenderId: "789904237680",
            appId: "1:789904237680:web:45b32dd8e211193e1e40b5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let esRegistro = false;

        window.alternarRegistro = () => {
            esRegistro = !esRegistro;
            document.getElementById('registroExtra').classList.toggle('hidden');
            document.querySelector('#formLogin button').textContent = esRegistro ? 'Registrarse' : 'Iniciar Sesión';
        };

        document.getElementById('btnGoogle').addEventListener('click', async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                await guardarUsuario(user, user.displayName || 'Usuario Google');
                window.location.href = 'index.html';
            } catch (error) {
                alert('Error con Google: ' + error.message);
            }
        });

        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                let user;
                if (esRegistro) {
                    const whatsapp = document.getElementById('whatsapp').value;
                    const cred = await createUserWithEmailAndPassword(auth, email, password);
                    user = cred.user;
                    await guardarUsuario(user, 'Cliente Correo', whatsapp);
                } else {
                    const cred = await signInWithEmailAndPassword(auth, email, password);
                    user = cred.user;
                }
                window.location.href = 'index.html';
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });

        async function guardarUsuario(user, nombre, whatsapp = '') {
            const docRef = doc(db, "usuarios_registrados", user.uid);
            await setDoc(docRef, {
                clienteEmail: user.email,
                nombre: nombre,
                whatsapp: whatsapp,
                rol: 'cliente',
                fechaRegistro: new Date().toLocaleDateString()
            }, { merge: true });
        }
    </script>
</body>
</html>
